<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://maps.googleapis.com/maps/api/js">
</script>
    <style>
        #div{
            height: 500px;
        }
    </style>
</head>
<body>
    <div id="div"> </div>
    <script>
        //console.log(window.navigator.geolocation);
        let x=document.getElementById('div');
        if(navigator.geolocation){
            navigator.geolocation.getCurrentPosition(showposition)
           // alert ("supported");
        }
        else{
            alert (" not supported");
        }
        function showposition(pos){
            let lan=pos.coords.latitude;
            let lon=pos.coords.longitude;
            // x.innerHTML="latitude" +lan+"longitude"+lon;
           let LatLng=  new google.maps.LatLng(lan,lon);
           let mymap=new google.maps.Map(x,{
            zoom:16,
            center:LatLng,
            mapTypeId:"roadmap"
           });
           new google.maps.Marker({
            position:LatLng,
            title:"mylocation",
            map:mymap
           });
             
        }
    </script>
</body>
</html>
